{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-exclamation-triangle text-danger" style="font-size: 6rem;"></i>
    <h1 class="mt-4">500</h1>
    <h4 class="text-muted">Internal Server Error</h4>
    <p class="text-muted">Something went wrong on our end. Please try again later.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-3">
        <i class="bi bi-house me-1"></i>Back to Dashboard
    </a>
</div>
{% endblock %}
